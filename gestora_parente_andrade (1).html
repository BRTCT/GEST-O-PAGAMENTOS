<style>
  :root{
    --bg:#F4F6F2; --surface:#FFFFFF; --surface-2:#EEF2EC; --ink:#17201B; --muted:#5F6B64; --line:#E2E7E1;
    --verde:#3B6A1F; --verde-2:#619935; --verde-bg:#E6F2E0;
    --laranja:#EAA837; --laranja-ink:#8A5A00; --laranja-bg:#FDF1DA;
    --vermelho:#C8372D; --vermelho-bg:#FBE9E7;
    --azul:#2563A8; --azul-bg:#E3EEFA;
    --sombra:0 1px 2px rgba(23,32,27,.06), 0 8px 24px -12px rgba(23,32,27,.18);
    --titulo:'Bricolage Grotesque', 'Segoe UI', Roboto, Arial, sans-serif;
    --corpo:'Manrope', 'Segoe UI', Roboto, Arial, sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1411; --surface:#171E19; --surface-2:#1E2721; --ink:#E8EEE9; --muted:#9AA69F; --line:#27312B;
      --verde:#8CC063; --verde-2:#7DB356; --verde-bg:#1D2B18;
      --laranja-ink:#F0C063; --laranja-bg:#2D2412;
      --vermelho:#F07468; --vermelho-bg:#301816; --azul:#7FB2EA; --azul-bg:#15233A;
      --sombra:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1411; --surface:#171E19; --surface-2:#1E2721; --ink:#E8EEE9; --muted:#9AA69F; --line:#27312B;
    --verde:#8CC063; --verde-2:#7DB356; --verde-bg:#1D2B18;
    --laranja-ink:#F0C063; --laranja-bg:#2D2412;
    --vermelho:#F07468; --vermelho-bg:#301816; --azul:#7FB2EA; --azul-bg:#15233A;
    --sombra:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
  }
  *,*::before,*::after{box-sizing:inherit;}
  html{height:100%;scroll-padding-top:env(safe-area-inset-top, 0px);}
  body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--corpo);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  button,input{font:inherit;color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:3px solid var(--laranja);outline-offset:2px;border-radius:6px;}
  .num{font-variant-numeric:tabular-nums;}
  .oculto{display:none !important;}

  /* ---------- barra do topo ---------- */
  .topo{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:color-mix(in srgb, var(--bg) 86%, transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s;}
  .topo.rolou{border-bottom-color:var(--line);}
  .topo-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 18px;}
  .topo-logo{height:30px;width:auto;}
  .topo-tit{flex:1;min-width:0;}
  .topo-tit b{display:block;font-family:var(--titulo);font-size:17px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topo-tit small{color:var(--muted);font-size:12px;}
  .icone-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icone-btn svg{width:19px;height:19px;}
  .girando svg{animation:girar .8s linear infinite;}
  @keyframes girar{to{transform:rotate(360deg);}}
  .abas-topo{display:none;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;}
  .abas-topo button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--muted);}
  .abas-topo button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--sombra);}
  @media (min-width:860px){ .abas-topo{display:flex;} .nav{display:none !important;} main{padding-bottom:40px !important;} }

  main{max-width:1080px;margin:0 auto;padding:6px 18px calc(96px + env(safe-area-inset-bottom, 0px));}

  /* ---------- navegação inferior (celular) ---------- */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom, 0px));}
  .nav button{flex:1;max-width:140px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:12px;color:var(--muted);font-size:11.5px;font-weight:700;position:relative;}
  .nav svg{width:22px;height:22px;}
  .nav button[aria-current="page"]{color:var(--verde);}
  .nav button[aria-current="page"]::before{content:"";position:absolute;top:-9px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--verde-2);}
  .nav .ponto{position:absolute;top:2px;right:calc(50% - 18px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--vermelho);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;}

  /* ---------- início ---------- */
  .ola{margin:18px 0 4px;font-family:var(--titulo);font-weight:800;font-size:clamp(30px, 7vw, 44px);line-height:1.05;letter-spacing:-.015em;}
  .ola-sub{color:var(--muted);margin:0 0 24px;}
  .ambientes{display:grid;grid-template-columns:1fr;gap:16px;}
  @media (min-width:760px){ .ambientes{grid-template-columns:1fr 1fr;} }
  .amb{position:relative;text-align:left;border:0;border-radius:24px;padding:22px 22px 20px;color:#fff;overflow:hidden;min-height:218px;display:flex;flex-direction:column;box-shadow:var(--sombra);transition:transform .25s cubic-bezier(.2,.8,.3,1);}
  .amb:hover{transform:translateY(-3px);}
  .amb:active{transform:scale(.985);}
  .amb.dp{background:radial-gradient(120% 90% at 100% 0%, #7DB356 0%, #3B6A1F 55%, #24420F 100%);}
  .amb.ci{background:radial-gradient(120% 90% at 100% 0%, #F2BF5E 0%, #C98414 55%, #7C4C00 100%);}
  .amb-deco{position:absolute;right:-30px;top:-30px;width:170px;height:170px;border-radius:50%;border:26px solid rgba(255,255,255,.09);}
  .amb-deco::after{content:"";position:absolute;inset:26px;border-radius:50%;border:14px solid rgba(255,255,255,.07);}
  .amb-rot{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85;}
  .amb-nome{font-family:var(--titulo);font-weight:800;font-size:27px;line-height:1.05;margin:6px 0 4px;}
  .amb-desc{opacity:.9;font-size:14px;max-width:30ch;}
  .amb-resumo{margin-top:auto;display:flex;gap:18px;flex-wrap:wrap;padding-top:18px;}
  .amb-resumo div{min-width:0;}
  .amb-resumo b{display:block;font-size:20px;font-weight:800;}
  .amb-resumo span{font-size:12px;opacity:.85;}
  .amb-ir{position:absolute;right:18px;bottom:18px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;}
  .amb-ir svg{width:20px;height:20px;}
  .amb-alerta{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.22);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700;margin-top:10px;align-self:flex-start;}
  .amb-alerta i{width:8px;height:8px;border-radius:50%;background:#FF8A80;box-shadow:0 0 0 0 rgba(255,138,128,.7);animation:pulso 1.8s infinite;}
  @keyframes pulso{70%{box-shadow:0 0 0 8px rgba(255,138,128,0);}100%{box-shadow:0 0 0 0 rgba(255,138,128,0);}}
  .rodape{color:var(--muted);font-size:12.5px;text-align:center;margin:28px 0 0;}

  /* ---------- telas dos ambientes ---------- */
  .cab-tela{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:16px 0 14px;}
  .cab-tela h1{margin:0;font-family:var(--titulo);font-weight:800;font-size:clamp(26px, 6vw, 34px);letter-spacing:-.01em;line-height:1.1;}
  .segment{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px;}
  .segment button{flex:1;border:0;background:transparent;padding:9px 16px;border-radius:11px;font-weight:700;color:var(--muted);white-space:nowrap;}
  .segment button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sombra);}
  .kpis{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:10px;margin:4px 0 18px;}
  @media (min-width:760px){ .kpis{grid-template-columns:repeat(4, minmax(0,1fr));} }
  .kpi{background:var(--surface);border-radius:18px;padding:14px 15px;box-shadow:var(--sombra);border:1px solid var(--line);min-width:0;}
  .kpi-rot{font-size:12px;color:var(--muted);font-weight:700;}
  .kpi-val{font-size:clamp(17px, 4.6vw, 22px);font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi-sub{font-size:12px;color:var(--muted);margin-top:1px;}
  .kpi.alerta{background:var(--vermelho-bg);border-color:transparent;} .kpi.alerta .kpi-val{color:var(--vermelho);}
  .kpi.atencao{background:var(--laranja-bg);border-color:transparent;} .kpi.atencao .kpi-val{color:var(--laranja-ink);}
  .kpi.ok .kpi-val{color:var(--verde);}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap;}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .chip .n{opacity:.7;margin-left:4px;}
  .busca{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:12px;}
  .busca svg{width:18px;height:18px;color:var(--muted);flex-shrink:0;}
  .busca input{flex:1;border:0;background:transparent;padding:12px 0;outline:none;min-width:0;}
  .grupo-tit{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 4px 8px;display:flex;justify-content:space-between;}
  .lista{display:grid;grid-template-columns:1fr;gap:10px;}
  @media (min-width:860px){ .lista.duas{grid-template-columns:1fr 1fr;} }
  .item{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 14px 12px;box-shadow:var(--sombra);transition:transform .2s;}
  .item:active{transform:scale(.99);}
  .data-bloco{width:54px;flex-shrink:0;border-radius:14px;background:var(--surface-2);text-align:center;padding:7px 0 6px;}
  .data-bloco b{display:block;font-size:20px;font-weight:800;line-height:1;}
  .data-bloco span{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);}
  .item.venc .data-bloco{background:var(--vermelho-bg);} .item.venc .data-bloco b{color:var(--vermelho);}
  .item.hoje .data-bloco{background:var(--laranja-bg);} .item.hoje .data-bloco b{color:var(--laranja-ink);}
  .item.pago .data-bloco{background:var(--verde-bg);} .item.pago .data-bloco b{color:var(--verde);}
  .item-corpo{flex:1;min-width:0;}
  .item-tit{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item-dir{text-align:right;flex-shrink:0;}
  .item-valor{font-weight:800;}
  .pill{display:inline-block;margin-top:4px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:800;white-space:nowrap;}
  .pill.venc{background:var(--vermelho-bg);color:var(--vermelho);}
  .pill.hoje{background:var(--laranja-bg);color:var(--laranja-ink);}
  .pill.aberto{background:var(--azul-bg);color:var(--azul);}
  .pill.pago{background:var(--verde-bg);color:var(--verde);}
  .pill.cinza{background:var(--surface-2);color:var(--muted);}
  .vazio{text-align:center;color:var(--muted);padding:44px 20px;background:var(--surface);border:1px dashed var(--line);border-radius:18px;}
  .vazio b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px;}
  .carregando{padding:60px 0;text-align:center;color:var(--muted);}
  .esqueleto{height:74px;border-radius:18px;background:linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%);background-size:200% 100%;animation:brilho 1.2s linear infinite;margin-bottom:10px;}
  @keyframes brilho{to{background-position:-200% 0;}}
  .regua{height:6px;border-radius:3px;background:var(--surface-2);margin-top:8px;overflow:hidden;}
  .regua i{display:block;height:100%;border-radius:3px;}

  /* entrada suave dos cartões */
  .entra{animation:entra .45s cubic-bezier(.2,.8,.3,1) backwards;}
  @keyframes entra{from{opacity:0;transform:translateY(10px);}}

  /* ---------- painel de detalhe (bottom sheet) ---------- */
  .veu{position:fixed;inset:0;z-index:40;background:rgba(8,12,10,.45);opacity:0;pointer-events:none;transition:opacity .25s;}
  .veu.ver{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;display:flex;flex-direction:column;background:var(--surface);border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom, 0px);}
  .sheet.ver{transform:none;}
  @media (min-width:860px){ .sheet{left:50%;right:auto;width:640px;bottom:50%;border-radius:24px;transform:translate(-50%, 60%) scale(.96);opacity:0;max-height:82vh;transition:transform .3s cubic-bezier(.2,.8,.2,1), opacity .25s;} .sheet.ver{transform:translate(-50%, 50%);opacity:1;} }
  .sheet-alca{width:44px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 4px;flex-shrink:0;}
  .sheet-cab{display:flex;align-items:flex-start;gap:12px;padding:8px 20px 12px;border-bottom:1px solid var(--line);}
  .sheet-cab h2{margin:0;font-family:var(--titulo);font-size:22px;line-height:1.15;flex:1;}
  .sheet-cab small{display:block;color:var(--muted);font-size:13px;font-family:var(--corpo);font-weight:500;margin-top:2px;}
  .sheet-corpo{overflow-y:auto;padding:14px 20px 22px;-webkit-overflow-scrolling:touch;}
  .destaque{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--surface-2);border-radius:16px;padding:14px 16px;margin-bottom:14px;flex-wrap:wrap;}
  .destaque b{font-size:26px;font-weight:800;}
  .campos{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-bottom:14px;}
  .campos div span{display:block;font-size:12px;color:var(--muted);font-weight:700;}
  .campos div b{font-weight:700;word-break:break-word;}
  .linha{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
  .linha:last-child{border-bottom:0;}
  .linha-nome{font-weight:700;} .linha-sub{font-size:12.5px;color:var(--muted);}
  .copiar{display:flex;gap:8px;align-items:center;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:12.5px;word-break:break-all;margin-bottom:12px;}
  .copiar button{flex-shrink:0;border:0;background:var(--ink);color:var(--bg);border-radius:9px;padding:7px 12px;font-weight:700;font-size:12.5px;}
  .link-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;font-weight:700;color:var(--ink);text-decoration:none;margin-top:6px;}
  .tl{position:relative;padding-left:20px;margin:6px 0 4px;}
  .tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line);}
  .tl div{position:relative;padding-bottom:12px;}
  .tl div::before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;border:2px solid var(--laranja);background:var(--surface);}
  .tl small{display:block;color:var(--muted);font-size:12px;}

  .aviso-toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom, 0px));transform:translate(-50%, 20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:13.5px;opacity:0;pointer-events:none;transition:all .3s;z-index:60;white-space:nowrap;}
  .aviso-toast.ver{opacity:1;transform:translate(-50%, 0);}
  @media (min-width:860px){ .aviso-toast{bottom:28px;} }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01s !important;animation-delay:0s !important;transition-duration:.01s !important;}
  }
</style>
</head>

<script>
/* =====================================================================
   APP DA GESTORA - Parente Andrade
   Só LEITURA: acompanha as solicitações de pagamento do Departamento
   Pessoal (férias e rescisões) e o Controle Integrado (boletos e
   contratos). Os dados vêm do mesmo Supabase do Portal de Ambientes.
   ===================================================================== */
var SUPABASE_URL = 'https://dzkxbvcxasvokdvjsmeb.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6a3hidmN4YXN2b2tkdmpzbWViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNjk0MTUsImV4cCI6MjEwMjc0NTQxNX0.bRcgkjme7bV6Bju7B2yjErvR2VqWrY69SQ0pvmENKuk';

var st = { tela:'inicio', dp:null, ci:null, carregando:false, atualizadoEm:null,
           dpAba:'ferias', dpFiltro:'pendentes', ciAba:'boletos', ciFiltro:'aberto', ciBusca:'', ctBusca:'' };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function moeda(v){ return (Number(v) || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' }); }
function hojeISO(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dataObj(iso){ if(!iso) return null; var p = String(iso).slice(0, 10).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function isoDe(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fmtData(iso){ if(!iso) return '-'; var p = String(iso).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function diasAte(iso){ var d = dataObj(iso); if(!d) return null; return Math.round((d - dataObj(hojeISO())) / 86400000); }
var MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
var SEMANA = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
function blocoData(iso){ var d = dataObj(iso); return '<div class="data-bloco"><b class="num">' + String(d.getDate()).padStart(2, '0') + '</b><span>' + MESES[d.getMonth()] + '</span></div>'; }
function somarMeses(iso, n){ var d = dataObj(iso); var dia = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(dia, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return isoDe(d); }
function somarDias(iso, n){ var d = dataObj(iso); d.setDate(d.getDate() + n); return isoDe(d); }
function aviso(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('ver'); clearTimeout(aviso._t); aviso._t = setTimeout(function(){ t.classList.remove('ver'); }, 2400); }

/* ---------- dados (REST do Supabase, de 1000 em 1000) ---------- */
async function buscarTudo(tabela, colunas, extra){
  var todos = [], ini = 0, PAG = 1000;
  while(true){
    var url = SUPABASE_URL + '/rest/v1/' + tabela + '?select=' + encodeURIComponent(colunas) + (extra ? '&' + extra : '');
    var r = await fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, Range: ini + '-' + (ini + PAG - 1), 'Range-Unit': 'items' } });
    if(!r.ok){ var t = await r.text(); var m; try{ m = JSON.parse(t).message; }catch(e){ m = t; } throw new Error(tabela + ': ' + (m || r.status)); }
    var lote = await r.json();
    todos = todos.concat(lote);
    if(lote.length < PAG) break;
    ini += PAG;
  }
  return todos;
}

async function carregarDP(){
  /* só as colunas necessárias - nada de salário, CPF ou dados bancários */
  var r = await Promise.all([
    buscarTudo('dp_colaboradores', 'matricula,nome,funcao,centro_custo,ferias_pagar,data_pagamento_ferias,valor_ferias,mqp,data_pagamento_mqp,valor_mqp,valor_multa_fgts',
               'or=(ferias_pagar.eq.true,data_pagamento_mqp.not.is.null)'),
    buscarTudo('dp_pagamentos_realizados', 'tipo,data_pagamento,pago')
  ]);
  var pagos = {};
  r[1].forEach(function(p){ if(p.pago !== false) pagos[p.tipo + '|' + String(p.data_pagamento).slice(0, 10)] = true; });
  var grupos = { ferias:{}, rescisao:{} };
  r[0].forEach(function(c){
    if(c.ferias_pagar && c.data_pagamento_ferias){
      var d = String(c.data_pagamento_ferias).slice(0, 10);
      (grupos.ferias[d] = grupos.ferias[d] || []).push({ nome:c.nome, matricula:c.matricula, funcao:c.funcao, cc:c.centro_custo, valor:Number(c.valor_ferias) || 0 });
    }
    if(c.mqp && String(c.mqp).trim() && c.data_pagamento_mqp){
      var d2 = String(c.data_pagamento_mqp).slice(0, 10);
      (grupos.rescisao[d2] = grupos.rescisao[d2] || []).push({ nome:c.nome, matricula:c.matricula, funcao:c.funcao, cc:c.centro_custo, valor:Number(c.valor_mqp) || 0, fgts:Number(c.valor_multa_fgts) || 0 });
    }
  });
  var montar = function(tipo){
    return Object.keys(grupos[tipo]).sort().map(function(d){
      var pes = grupos[tipo][d].sort(function(a,b){ return String(a.nome).localeCompare(String(b.nome), 'pt-BR'); });
      var total = pes.reduce(function(s,p){ return s + p.valor; }, 0);
      var fgts = pes.reduce(function(s,p){ return s + (p.fgts || 0); }, 0);
      var pago = !!pagos[tipo + '|' + d];
      var dias = diasAte(d);
      return { tipo:tipo, data:d, pessoas:pes, total:total, fgts:fgts, pago:pago, situacao: pago ? 'pago' : (dias < 0 ? 'venc' : (dias === 0 ? 'hoje' : 'aberto')), dias:dias };
    });
  };
  st.dp = { ferias: montar('ferias'), rescisao: montar('rescisao') };
}

async function carregarCI(){
  var r = await Promise.all([
    buscarTudo('ci_contratos', '*'),
    buscarTudo('ci_aditivos', 'contrato,numero_aditivo,tipo,data_assinatura,meses_acrescidos,nova_data_fim,valor_acrescimo,novo_valor_parcela,descricao'),
    buscarTudo('ci_boletos', '*')
  ]);
  st.ci = { contratos: r[0], aditivos: r[1], boletos: r[2] };
}

/* regras iguais às do Portal (Controle Integrado) */
function contratoEfetivo(c){
  var fim = (c.data_inicio && c.duracao_meses) ? somarDias(somarMeses(c.data_inicio, parseInt(c.duracao_meses, 10)), -1) : (c.data_fim || null);
  var valor = Number(c.valor_total) || 0, parcela = Number(c.valor_parcela) || 0;
  var ads = st.ci.aditivos.filter(function(a){ return String(a.contrato || '').trim() === String(c.numero || '').trim(); })
    .sort(function(a,b){ return String(a.data_assinatura || '').localeCompare(String(b.data_assinatura || '')); });
  ads.forEach(function(a){
    if(a.nova_data_fim) fim = a.nova_data_fim; else if(a.meses_acrescidos && fim) fim = somarMeses(fim, parseInt(a.meses_acrescidos, 10));
    if(a.valor_acrescimo) valor += Number(a.valor_acrescimo) || 0;
    if(a.novo_valor_parcela) parcela = Number(a.novo_valor_parcela);
  });
  return { fim:fim, valor:valor, parcela:parcela, aditivos:ads };
}
function emAberto(b){ return !/^pago$|cancel/i.test(b.status || ''); }
function sitBoleto(b){
  if(/^pago$/i.test(b.status || '')) return { cls:'pago', txt:'Pago' };
  if(/cancel/i.test(b.status || '')) return { cls:'cinza', txt:'Cancelado' };
  var d = diasAte(b.vencimento);
  if(d < 0) return { cls:'venc', txt:'Vencido há ' + Math.abs(d) + (Math.abs(d) === 1 ? ' dia' : ' dias') };
  if(d === 0) return { cls:'hoje', txt:'Vence hoje' };
  if(d === 1) return { cls:'aberto', txt:'Vence amanhã' };
  return { cls:'aberto', txt:'Vence em ' + d + ' dias' };
}
function sitContrato(c){
  if(/encerrad/i.test(c.status || '')) return { cls:'cinza', txt:'Encerrado' };
  if(/suspens/i.test(c.status || '')) return { cls:'cinza', txt:'Suspenso' };
  var e = contratoEfetivo(c); if(!e.fim) return { cls:'aberto', txt: c.status || 'Vigente' };
  var d = diasAte(e.fim), lim = parseInt(c.alerta_dias, 10) || 30;
  if(d < 0) return { cls:'venc', txt:'Venceu há ' + Math.abs(d) + ' dias' };
  if(d <= lim) return { cls:'hoje', txt:'Vence em ' + d + ' dias' };
  return { cls:'pago', txt:'Vigente' };
}

/* ---------- navegação ---------- */
function ir(tela){
  st.tela = tela;
  document.querySelectorAll('[data-ir]').forEach(function(b){ b.setAttribute('aria-current', b.getAttribute('data-ir') === tela ? 'page' : 'false'); });
  var titulos = { inicio:['Gestão','Parente Andrade'], dp:['Departamento Pessoal','Férias e rescisões a pagar'], ci:['Controle Integrado','Boletos e contratos'] };
  $('topo-titulo').textContent = titulos[tela][0]; $('topo-sub').textContent = titulos[tela][1];
  try{ history.replaceState(null, '', '#' + tela); }catch(e){}
  window.scrollTo(0, 0);
  render();
  if(tela === 'dp' && !st.dp && !st.carregando) garantir('dp');
  if(tela === 'ci' && !st.ci && !st.carregando) garantir('ci');
}
async function garantir(qual){
  try{ if(qual === 'dp') await carregarDP(); else await carregarCI(); st.atualizadoEm = new Date(); }
  catch(e){ console.error(e); st['erro_' + qual] = e.message; }
  render(); atualizarPontos();
}
async function atualizar(){
  if(st.carregando) return;
  st.carregando = true; $('b-atualizar').classList.add('girando');
  st.erro_dp = st.erro_ci = null;
  try{ await Promise.all([carregarDP().catch(function(e){ st.erro_dp = e.message; }), carregarCI().catch(function(e){ st.erro_ci = e.message; })]); st.atualizadoEm = new Date(); aviso('Informações atualizadas'); }
  finally{ st.carregando = false; $('b-atualizar').classList.remove('girando'); render(); atualizarPontos(); }
}
function render(){
  if(st.tela === 'dp') renderDP(); else if(st.tela === 'ci') renderCI(); else renderInicio();
}
function atualizarPontos(){
  var nDp = st.dp ? st.dp.ferias.concat(st.dp.rescisao).filter(function(g){ return g.situacao === 'venc' || g.situacao === 'hoje'; }).length : 0;
  var nCi = st.ci ? st.ci.boletos.filter(function(b){ return emAberto(b) && diasAte(b.vencimento) <= 0; }).length : 0;
  [['ponto-dp', nDp], ['ponto-ci', nCi]].forEach(function(p){ var el = $(p[0]); el.textContent = p[1]; el.classList.toggle('oculto', !p[1]); });
}
function erroHtml(msg){ return '<div class="vazio"><b>Não foi possível carregar</b>' + esc(msg) + '<br><br><button class="chip" onclick="atualizar()">Tentar de novo</button></div>'; }
function esqueletos(n){ var h = ''; for(var i = 0; i < n; i++) h += '<div class="esqueleto" style="animation-delay:' + (i * 80) + 'ms"></div>'; return h; }
function kpi(rot, val, sub, cls, i){ return '<div class="kpi entra ' + (cls || '') + '" style="animation-delay:' + (i * 50) + 'ms"><div class="kpi-rot">' + rot + '</div><div class="kpi-val num">' + val + '</div>' + (sub ? '<div class="kpi-sub">' + sub + '</div>' : '') + '</div>'; }

/* ---------- INÍCIO: escolha do ambiente ---------- */

    + '<p class="rodape">' + (st.atualizadoEm ? 'Atualizado às ' + st.atualizadoEm.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }) + ' | ' : '') + 'Somente consulta</p>';
}

/* ---------- DEPARTAMENTO PESSOAL ---------- */
function dpAba(a){ st.dpAba = a; renderDP(); }
function dpFiltro(f){ st.dpFiltro = f; renderDP(); }
function renderDP(){
  var el = $('tela');
  if(st.erro_dp){ el.innerHTML = erroHtml(st.erro_dp); return; }
  var seg = '<div class="segment" role="group" aria-label="Tipo"><button aria-pressed="' + (st.dpAba === 'ferias') + '" onclick="dpAba(\'ferias\')">Férias</button><button aria-pressed="' + (st.dpAba === 'rescisao') + '" onclick="dpAba(\'rescisao\')">Rescisões</button></div>';
  var cab = '<div class="cab-tela"><h1>' + (st.dpAba === 'ferias' ? 'Férias' : 'Rescisões') + '</h1>' + seg + '</div>';
  if(!st.dp){ el.innerHTML = cab + esqueletos(4); return; }
  var todos = st.dp[st.dpAba];
  var pend = todos.filter(function(g){ return !g.pago; });
  var atras = pend.filter(function(g){ return g.situacao === 'venc'; });
  var mes = hojeISO().slice(0, 7);
  var pagoMes = todos.filter(function(g){ return g.pago && g.data.slice(0, 7) === mes; });
  var totalPend = pend.reduce(function(s,g){ return s + g.total + (g.fgts || 0); }, 0);
  var prox = pend.filter(function(g){ return g.dias >= 0; })[0];
  var kpis = '<div class="kpis">'
    + kpi('A pagar', moeda(totalPend), pend.length + (pend.length === 1 ? ' data' : ' datas'), '', 0)
    + kpi('Em atraso', String(atras.length), atras.length ? moeda(atras.reduce(function(s,g){ return s + g.total + (g.fgts || 0); }, 0)) : 'nenhuma data', atras.length ? 'alerta' : 'ok', 1)
    + kpi('Próximo pagamento', prox ? fmtData(prox.data) : '-', prox ? (prox.dias === 0 ? 'hoje' : 'em ' + prox.dias + (prox.dias === 1 ? ' dia' : ' dias')) : '', prox && prox.dias <= 2 ? 'atencao' : '', 2)
    + kpi('Pago neste mês', moeda(pagoMes.reduce(function(s,g){ return s + g.total + (g.fgts || 0); }, 0)), pagoMes.length + (pagoMes.length === 1 ? ' data' : ' datas'), '', 3)
    + '</div>';
  var cont = { pendentes: pend.length, pagos: todos.length - pend.length, todos: todos.length };
  var chips = '<div class="chips">' + [['pendentes','Pendentes'],['pagos','Pagos'],['todos','Todos']].map(function(c){
    return '<button class="chip" aria-pressed="' + (st.dpFiltro === c[0]) + '" onclick="dpFiltro(\'' + c[0] + '\')">' + c[1] + '<span class="n num">' + cont[c[0]] + '</span></button>'; }).join('') + '</div>';
  var lista = todos.filter(function(g){ return st.dpFiltro === 'todos' || (st.dpFiltro === 'pagos' ? g.pago : !g.pago); });
  if(st.dpFiltro !== 'pagos') lista.sort(function(a,b){ return a.data.localeCompare(b.data); }); else lista.sort(function(a,b){ return b.data.localeCompare(a.data); });
  var rotSit = { pago:'Pago', venc:'Atrasado', hoje:'Hoje', aberto:'A pagar' };
  var itens = !lista.length
    ? '<div class="vazio"><b>' + (st.dpFiltro === 'pendentes' ? 'Tudo em dia' : 'Nada por aqui') + '</b>' + (st.dpFiltro === 'pendentes' ? 'Nenhuma solicitação de ' + (st.dpAba === 'ferias' ? 'férias' : 'rescisão') + ' pendente.' : 'Nenhum registro neste filtro.') + '</div>'
    : '<div class="lista duas">' + lista.map(function(g, i){
        var d = dataObj(g.data);
        return '<button class="item entra ' + g.situacao + '" style="animation-delay:' + Math.min(i * 40, 400) + 'ms" onclick="dpDetalhe(\'' + g.tipo + '\',\'' + g.data + '\')">' + blocoData(g.data)
          + '<div class="item-corpo"><div class="item-tit">' + SEMANA[d.getDay()].charAt(0).toUpperCase() + SEMANA[d.getDay()].slice(1) + ', ' + fmtData(g.data) + '</div>'
          + '<div class="item-sub">' + g.pessoas.length + (g.pessoas.length === 1 ? ' colaborador' : ' colaboradores') + (g.fgts ? ' | + multa FGTS' : '') + '</div></div>'
          + '<div class="item-dir"><div class="item-valor num">' + moeda(g.total + (g.fgts || 0)) + '</div><span class="pill ' + g.situacao + '">' + rotSit[g.situacao] + '</span></div></button>';
      }).join('') + '</div>';
  el.innerHTML = cab + kpis + chips + itens;
}
function dpDetalhe(tipo, data){
  var g = st.dp[tipo].find(function(x){ return x.data === data; }); if(!g) return;
  var porCC = {};
  g.pessoas.forEach(function(p){ var k = p.cc || 'Sem CC'; porCC[k] = (porCC[k] || 0) + p.valor + (p.fgts || 0); });
  var sitTxt = { pago:'Pago', venc:'Atrasado há ' + Math.abs(g.dias) + ' dia(s)', hoje:'Vence hoje', aberto:'Vence em ' + g.dias + ' dia(s)' }[g.situacao];
  var h = '<div class="destaque"><div><span class="pill ' + g.situacao + '">' + sitTxt + '</span></div><b class="num">' + moeda(g.total + (g.fgts || 0)) + '</b></div>'
    + '<div class="campos"><div><span>Tipo</span><b>' + (tipo === 'ferias' ? 'Férias' : 'Rescisão') + '</b></div><div><span>Colaboradores</span><b class="num">' + g.pessoas.length + '</b></div>'
    + (g.fgts ? '<div><span>Valor ' + (tipo === 'ferias' ? 'das férias' : 'das rescisões') + '</span><b class="num">' + moeda(g.total) + '</b></div><div><span>Multa FGTS</span><b class="num">' + moeda(g.fgts) + '</b></div>' : '')
    + '</div>'
    + '<div class="grupo-tit" style="margin-top:4px;"><span>Por centro de custo</span></div>'
    + Object.keys(porCC).sort().map(function(k){ return '<div class="linha"><span class="linha-nome">CC ' + esc(k) + '</span><b class="num">' + moeda(porCC[k]) + '</b></div>'; }).join('')
    + '<div class="grupo-tit"><span>Colaboradores</span></div>'
    + g.pessoas.map(function(p){
        return '<div class="linha"><div><div class="linha-nome">' + esc(p.nome) + '</div><div class="linha-sub">Mat. ' + esc(p.matricula) + (p.funcao ? ' | ' + esc(p.funcao) : '') + (p.cc ? ' | CC ' + esc(p.cc) : '') + '</div></div>'
          + '<div style="text-align:right;"><b class="num">' + moeda(p.valor) + '</b>' + (p.fgts ? '<div class="linha-sub num">+ FGTS ' + moeda(p.fgts) + '</div>' : '') + '</div></div>';
      }).join('');
  abrirSheet('Pagamento de ' + fmtData(data), h);
}

/* ---------- CONTROLE INTEGRADO ---------- */
function ciAba(a){ st.ciAba = a; renderCI(); }
function ciFiltro(f){ st.ciFiltro = f; renderCI(); }
var buscaT;
function ciBuscar(v, campo){ st[campo] = v; clearTimeout(buscaT); buscaT = setTimeout(function(){ renderCI(true); }, 160); }
function renderCI(manterFoco){
  var el = $('tela');
  if(st.erro_ci){ el.innerHTML = erroHtml(st.erro_ci); return; }
  var seg = '<div class="segment" role="group" aria-label="Visão"><button aria-pressed="' + (st.ciAba === 'boletos') + '" onclick="ciAba(\'boletos\')">Boletos</button><button aria-pressed="' + (st.ciAba === 'contratos') + '" onclick="ciAba(\'contratos\')">Contratos</button></div>';
  var cab = '<div class="cab-tela"><h1>' + (st.ciAba === 'boletos' ? 'Boletos' : 'Contratos') + '</h1>' + seg + '</div>';
  if(!st.ci){ el.innerHTML = cab + esqueletos(5); return; }
  el.innerHTML = cab + (st.ciAba === 'boletos' ? htmlBoletos() : htmlContratos());
  if(manterFoco){ var i = $('ci-busca'); if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
}
function htmlBoletos(){
  var bs = st.ci.boletos.filter(function(b){ return !/cancel/i.test(b.status || ''); });
  var ab = bs.filter(emAberto);
  var venc = ab.filter(function(b){ return diasAte(b.vencimento) < 0; });
  var hoje = ab.filter(function(b){ return diasAte(b.vencimento) === 0; });
  var sem = ab.filter(function(b){ var d = diasAte(b.vencimento); return d > 0 && d <= 7; });
  var mes = hojeISO().slice(0, 7);
  var pagoMes = bs.filter(function(b){ return !emAberto(b) && String(b.data_pagamento || '').slice(0, 7) === mes; });
  var soma = function(a, pago){ return a.reduce(function(s,b){ return s + (Number(pago ? (b.valor_pago || b.valor) : b.valor) || 0); }, 0); };
  var kpis = '<div class="kpis">'
    + kpi('Vencidos', moeda(soma(venc)), venc.length + (venc.length === 1 ? ' boleto' : ' boletos'), venc.length ? 'alerta' : 'ok', 0)
    + kpi('Vencem hoje', moeda(soma(hoje)), hoje.length + (hoje.length === 1 ? ' boleto' : ' boletos'), hoje.length ? 'atencao' : '', 1)
    + kpi('Próximos 7 dias', moeda(soma(sem)), sem.length + (sem.length === 1 ? ' boleto' : ' boletos'), '', 2)
    + kpi('Pago neste mês', moeda(soma(pagoMes, true)), pagoMes.length + (pagoMes.length === 1 ? ' boleto' : ' boletos'), '', 3)
    + '</div>';
  var cont = { aberto: ab.length, venc: venc.length, pago: bs.length - ab.length, todos: bs.length };
  var chips = '<div class="chips">' + [['aberto','Em aberto'],['venc','Vencidos'],['pago','Pagos'],['todos','Todos']].map(function(c){
    return '<button class="chip" aria-pressed="' + (st.ciFiltro === c[0]) + '" onclick="ciFiltro(\'' + c[0] + '\')">' + c[1] + '<span class="n num">' + cont[c[0]] + '</span></button>'; }).join('') + '</div>';
  var busca = '<label class="busca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'
    + '<input id="ci-busca" type="search" placeholder="Buscar fornecedor, contrato, setor…" value="' + esc(st.ciBusca) + '" oninput="ciBuscar(this.value, \'ciBusca\')"></label>';
  var q = st.ciBusca.trim().toLowerCase();
  var lista = bs.filter(function(b){
    if(st.ciFiltro === 'aberto' && !emAberto(b)) return false;
    if(st.ciFiltro === 'venc' && !(emAberto(b) && diasAte(b.vencimento) < 0)) return false;
    if(st.ciFiltro === 'pago' && emAberto(b)) return false;
    if(q && [b.fornecedor, b.contrato, b.setor, b.descricao].join(' ').toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  if(st.ciFiltro === 'pago') lista.sort(function(a,b){ return String(b.data_pagamento || b.vencimento).localeCompare(String(a.data_pagamento || a.vencimento)); });
  else lista.sort(function(a,b){ return String(a.vencimento).localeCompare(String(b.vencimento)); });
  if(!lista.length) return kpis + chips + busca + '<div class="vazio"><b>' + (st.ciFiltro === 'venc' ? 'Nenhum boleto vencido' : 'Nada por aqui') + '</b>' + (q ? 'Nada encontrado para "' + esc(st.ciBusca) + '".' : 'Nenhum boleto neste filtro.') + '</div>';

  /* agrupa por quando vence */
  var grupoDe = function(b){
    if(!emAberto(b)) return 'Pagos';
    var d = diasAte(b.vencimento);
    if(d < 0) return 'Vencidos'; if(d === 0) return 'Hoje'; if(d === 1) return 'Amanhã'; if(d <= 7) return 'Próximos 7 dias'; if(d <= 30) return 'Este mês e o próximo'; return 'Mais adiante';
  };
  var ordem = ['Vencidos','Hoje','Amanhã','Próximos 7 dias','Este mês e o próximo','Mais adiante','Pagos'];
  var grupos = {};
  lista.forEach(function(b){ var g = grupoDe(b); (grupos[g] = grupos[g] || []).push(b); });
  var i = 0;
  var html = ordem.filter(function(g){ return grupos[g]; }).map(function(g){
    var tot = grupos[g].reduce(function(s,b){ return s + (Number(b.valor) || 0); }, 0);
    return '<div class="grupo-tit"><span>' + g + '</span><span class="num">' + moeda(tot) + '</span></div><div class="lista duas">'
      + grupos[g].slice(0, 200).map(function(b){
          var s = sitBoleto(b);
          return '<button class="item entra ' + s.cls + '" style="animation-delay:' + Math.min(i++ * 30, 360) + 'ms" onclick="ciDetalheBoleto(' + b.id + ')">' + blocoData(b.vencimento)
            + '<div class="item-corpo"><div class="item-tit">' + esc(b.fornecedor || 'Boleto') + '</div><div class="item-sub">' + esc([b.descricao, b.contrato, b.setor].filter(Boolean).join(' | ') || '-') + '</div></div>'
            + '<div class="item-dir"><div class="item-valor num">' + moeda(b.valor) + '</div><span class="pill ' + s.cls + '">' + s.txt + '</span></div></button>';
        }).join('') + '</div>';
  }).join('');
  return kpis + chips + busca + html;
}
function ciDetalheBoleto(id){
  var b = st.ci.boletos.find(function(x){ return String(x.id) === String(id); }); if(!b) return;
  var s = sitBoleto(b);
  var c = st.ci.contratos.find(function(x){ return String(x.numero || '').trim() === String(b.contrato || '').trim(); });
  var h = '<div class="destaque"><span class="pill ' + s.cls + '">' + s.txt + '</span><b class="num">' + moeda(b.valor) + '</b></div>'

      + '<div><span>Vencimento</span><b>' + fmtData(b.vencimento) + '</b></div>'
      + '<div><span>Competência</span><b>' + esc(b.competencia || '-') + '</b></div>'

      + '<div><span>Forma</span><b>' + esc(b.forma_pagamento || '-') + '</b></div>'
      + '<div><span>Contrato</span><b>' + esc(b.contrato || '-') + '</b></div>'
      + '<div><span>Responsável</span><b>' + esc((c && c.responsavel) || '-') + '</b></div>'
      + (!emAberto(b) ? '<div><span>Pago em</span><b>' + fmtData(b.data_pagamento) + '</b></div><div><span>Valor pago</span><b class="num">' + moeda(b.valor_pago || b.valor) + '</b></div>' : '')

    + (c ? '<button class="link-btn" type="button" onclick="ciDetalheContrato(' + c.id + ')">Ver contrato ' + esc(c.numero) + '</button>' : '')
    + (b.observacoes ? '<p style="color:var(--muted);font-size:13px;margin-top:12px;white-space:pre-line;">' + esc(b.observacoes) + '</p>' : '');
  abrirSheet(esc(b.fornecedor || 'Boleto') + '<small>' + esc(b.descricao || '') + '</small>', h);
}
function copiar(v){
  var ok = function(){ aviso('Copiado'); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(ok, function(){ prompt('Copie:', v); });
  else prompt('Copie:', v);
}
function htmlContratos(){
  var q = st.ctBusca.trim().toLowerCase();
  var cs = st.ci.contratos.slice().filter(function(c){ return !q || [c.numero, c.fornecedor, c.objeto, c.setor, c.responsavel].join(' ').toLowerCase().indexOf(q) >= 0; });
  var ativos = st.ci.contratos.filter(function(c){ return !/encerrad|suspens/i.test(c.status || ''); });
  var mensal = ativos.reduce(function(s,c){ return s + contratoEfetivo(c).parcela; }, 0);
  var vencendo = ativos.filter(function(c){ return /^Venc/.test(sitContrato(c).txt); });
  var totalAtual = ativos.reduce(function(s,c){ return s + contratoEfetivo(c).valor; }, 0);
  var kpis = '<div class="kpis">'
    + kpi('Contratos ativos', String(ativos.length), st.ci.contratos.length + ' cadastrados', '', 0)
    + kpi('Parcelas por mês', moeda(mensal), 'contratos ativos', '', 1)
    + kpi('Vencendo ou vencidos', String(vencendo.length), vencendo.length ? 'precisam de decisão' : 'nenhum', vencendo.length ? 'atencao' : 'ok', 2)
    + kpi('Valor total ativo', moeda(totalAtual), 'com aditivos', '', 3)
    + '</div>';
  var busca = '<label class="busca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'
    + '<input id="ci-busca" type="search" placeholder="Buscar contrato, fornecedor, setor…" value="' + esc(st.ctBusca) + '" oninput="ciBuscar(this.value, \'ctBusca\')"></label>';
  var peso = { venc:0, hoje:1, aberto:2, pago:3, cinza:4 };
  cs.sort(function(a,b){ return (peso[sitContrato(a).cls] - peso[sitContrato(b).cls]) || String(a.numero).localeCompare(String(b.numero), 'pt-BR', { numeric:true }); });
  var porSetor = {};
  cs.forEach(function(c){ var k = c.setor || 'Sem setor'; (porSetor[k] = porSetor[k] || []).push(c); });
  var i = 0;
  var html = !cs.length ? '<div class="vazio"><b>Nenhum contrato</b>' + (q ? 'Nada encontrado para "' + esc(st.ctBusca) + '".' : 'Ainda não há contratos cadastrados.') + '</div>'
    : Object.keys(porSetor).sort(function(a,b){ return a.localeCompare(b, 'pt-BR'); }).map(function(setor){
        return '<div class="grupo-tit"><span>' + esc(setor) + '</span><span>' + porSetor[setor].length + '</span></div><div class="lista duas">'
          + porSetor[setor].map(function(c){
              var e = contratoEfetivo(c), s = sitContrato(c);
              var pct = 0;
              if(c.data_inicio && e.fim){ var tot = dataObj(e.fim) - dataObj(c.data_inicio), cor = dataObj(hojeISO()) - dataObj(c.data_inicio); pct = Math.max(0, Math.min(100, Math.round(cor / Math.max(tot, 1) * 100))); }
              var corR = { venc:'var(--vermelho)', hoje:'var(--laranja)', pago:'var(--verde-2)', aberto:'var(--azul)', cinza:'var(--muted)' }[s.cls];
              return '<button class="item entra" style="animation-delay:' + Math.min(i++ * 30, 360) + 'ms;align-items:stretch;" onclick="ciDetalheContrato(' + c.id + ')">'
                + '<div class="item-corpo"><div class="item-tit">' + esc(c.fornecedor || c.numero) + '</div><div class="item-sub">' + esc(c.numero + (c.objeto ? ' | ' + c.objeto : '')) + '</div>'
                + '<div class="regua"><i style="width:' + pct + '%;background:' + corR + ';"></i></div>'
                + '<div class="item-sub" style="margin-top:4px;">' + (e.fim ? 'até ' + fmtData(e.fim) : 'sem término') + (c.responsavel ? ' | ' + esc(c.responsavel) : '') + '</div></div>'
                + '<div class="item-dir"><div class="item-valor num">' + moeda(e.parcela) + '</div><div class="item-sub">por parcela</div><span class="pill ' + s.cls + '">' + s.txt + '</span></div></button>';
            }).join('') + '</div>';
      }).join('');
  return kpis + busca + html;
}
function ciDetalheContrato(id){
  var c = st.ci.contratos.find(function(x){ return String(x.id) === String(id); }); if(!c) return;
  var e = contratoEfetivo(c), s = sitContrato(c);
  var bs = st.ci.boletos.filter(function(b){ return String(b.contrato || '').trim() === String(c.numero).trim() && !/cancel/i.test(b.status || ''); });
  var pago = bs.filter(function(b){ return !emAberto(b); }).reduce(function(t,b){ return t + (Number(b.valor_pago || b.valor) || 0); }, 0);
  var aPagar = bs.filter(emAberto).reduce(function(t,b){ return t + (Number(b.valor) || 0); }, 0);
  var prox = bs.filter(emAberto).sort(function(a,b){ return String(a.vencimento).localeCompare(String(b.vencimento)); })[0];
  var h = '<div class="destaque"><span class="pill ' + s.cls + '">' + s.txt + '</span><b class="num">' + moeda(e.valor) + '</b></div>'
    + '<div class="campos">'
      + '<div><span>Objeto</span><b>' + esc(c.objeto || '-') + '</b></div>'
      + '<div><span>Setor</span><b>' + esc(c.setor || '-') + '</b></div>'
      + '<div><span>Responsável</span><b>' + esc(c.responsavel || '-') + '</b></div>'
      + '<div><span>Vigência</span><b>' + fmtData(c.data_inicio) + ' a ' + fmtData(e.fim) + '</b></div>'
      + '<div><span>Parcela</span><b class="num">' + moeda(e.parcela) + '</b></div>'
      + '<div><span>Pagamento</span><b>' + esc((c.periodicidade || '-') + (c.dia_pagamento ? ', dia ' + c.dia_pagamento : '')) + '</b></div>'
      + '<div><span>Já pago</span><b class="num">' + moeda(pago) + '</b></div>'
      + '<div><span>A pagar (lançado)</span><b class="num">' + moeda(aPagar) + '</b></div>'
      + (prox ? '<div><span>Próximo vencimento</span><b>' + fmtData(prox.vencimento) + '</b></div><div><span>Valor</span><b class="num">' + moeda(prox.valor) + '</b></div>' : '')
    + '</div>'
    + (e.aditivos.length ? '<div class="grupo-tit" style="margin-top:4px;"><span>Aditivos</span><span>' + e.aditivos.length + '</span></div><div class="tl">'
        + e.aditivos.map(function(a){
            var det = [];
            if(a.nova_data_fim) det.push('novo término ' + fmtData(a.nova_data_fim)); else if(a.meses_acrescidos) det.push('+' + a.meses_acrescidos + ' mês(es)');
            if(a.valor_acrescimo) det.push((Number(a.valor_acrescimo) > 0 ? '+' : '') + moeda(a.valor_acrescimo));
            if(a.novo_valor_parcela) det.push('parcela ' + moeda(a.novo_valor_parcela));
            return '<div><b>Aditivo ' + esc(a.numero_aditivo || '') + ' - ' + esc(a.tipo || '') + '</b><small>' + fmtData(a.data_assinatura) + (det.length ? ' | ' + esc(det.join(' | ')) : '') + '</small></div>';
          }).join('') + '</div>' : '')
    + (c.link_documento ? '<a class="link-btn" href="' + esc(c.link_documento) + '" target="_blank" rel="noopener">Abrir contrato assinado</a>' : '');
  abrirSheet('Contrato ' + esc(c.numero) + '<small>' + esc(c.fornecedor || '') + '</small>', h);
}

/* ---------- painel de detalhe ---------- */
var ultimoFoco = null;
function abrirSheet(tituloHtml, corpoHtml){
  ultimoFoco = document.activeElement;
  $('sheet-titulo').innerHTML = tituloHtml;
  $('sheet-corpo').innerHTML = corpoHtml;
  $('sheet-corpo').scrollTop = 0;
  $('veu').classList.add('ver'); $('sheet').classList.add('ver');
  document.body.style.overflow = 'hidden';
  setTimeout(function(){ var b = $('sheet').querySelector('.sheet-cab .icone-btn'); if(b) b.focus(); }, 60);
}
function fecharSheet(){
  $('veu').classList.remove('ver'); $('sheet').classList.remove('ver');
  document.body.style.overflow = '';
  if(ultimoFoco && ultimoFoco.focus) ultimoFoco.focus();
}
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && $('sheet').classList.contains('ver')) fecharSheet(); });
/* arrastar a alça para baixo fecha o painel (celular) */
(function(){
  var y0 = null, sh = $('sheet');
  sh.addEventListener('touchstart', function(e){ if(e.target.closest('.sheet-corpo') && $('sheet-corpo').scrollTop > 0) return; y0 = e.touches[0].clientY; }, { passive:true });
  sh.addEventListener('touchmove', function(e){ if(y0 === null) return; var dy = e.touches[0].clientY - y0; if(dy > 0){ sh.style.transition = 'none'; sh.style.transform = 'translateY(' + dy + 'px)'; } }, { passive:true });
  sh.addEventListener('touchend', function(e){ if(y0 === null) return; var dy = e.changedTouches[0].clientY - y0; sh.style.transition = ''; sh.style.transform = ''; y0 = null; if(dy > 110) fecharSheet(); });
})();

/* ---------- tema ---------- */
function alternarTema(){
  var escuro = document.documentElement.getAttribute('data-theme') === 'dark' ||
    (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
  var novo = escuro ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', novo);
  try{ localStorage.setItem('gestao_pa_tema', novo); }catch(e){}
}
try{ var t = localStorage.getItem('gestao_pa_tema'); if(t) document.documentElement.setAttribute('data-theme', t); }catch(e){}

window.addEventListener('scroll', function(){ $('topo').classList.toggle('rolou', window.scrollY > 4); }, { passive:true });
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible' && st.atualizadoEm && Date.now() - st.atualizadoEm > 120000) atualizar();
});

/* ---------- início ---------- */
(function(){
  var h = (location.hash || '').replace('#', '');
  atualizar();                     /* carrega os dois ambientes de uma vez */
  ir(/^(dp|ci)$/.test(h) ? h : 'inicio');
})();
</script>
